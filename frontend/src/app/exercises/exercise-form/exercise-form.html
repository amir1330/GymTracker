<div class="exercise-form">
  <h2>{{ isEdit ? 'Edit' : 'New' }} Exercise</h2>

  @if (error) {
    <div class="error">{{ error }}</div>
  }

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" [(ngModel)]="exercise.name" name="name" required>
    </div>

    <div class="form-group">
      <label for="muscleGroup">Muscle Group</label>
      <select id="muscleGroup" [(ngModel)]="exercise.muscleGroup" name="muscleGroup" required>
        @for (group of muscleGroups; track group) {
          <option [value]="group">{{ group }}</option>
        }
      </select>
    </div>

    <div class="form-group checkbox">
      <label>
        <input type="checkbox" [(ngModel)]="exercise.isDuration" name="isDuration">
        Duration-based (timed)
      </label>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn">{{ isEdit ? 'Update' : 'Create' }}</button>
      <a routerLink="/exercises" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
