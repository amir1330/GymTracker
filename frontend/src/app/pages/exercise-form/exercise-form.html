<div class="exercise-form">
  <h2>{{ (isEdit ? 'exercise.edit' : 'exercise.new') | translate }}</h2>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="name">{{ 'exercise.name' | translate }}</label>
      <input type="text" id="name" [(ngModel)]="exercise.name" name="name" required>
    </div>

    <div class="form-group">
      <label for="muscleGroup">{{ 'exercise.muscleGroup' | translate }}</label>
      <select id="muscleGroup" [(ngModel)]="exercise.muscleGroup" name="muscleGroup" required>
        @for (group of muscleGroups; track group) {
          <option [value]="group">{{ 'exercise.groups.' + group | translate }}</option>
        }
      </select>
    </div>

    <div class="form-group checkbox">
      <label>
        <input type="checkbox" [(ngModel)]="exercise.isDuration" name="isDuration">
        {{ 'exercise.durationBased' | translate }}
      </label>
    </div>

    @if (exercise.isDuration) {
      <div class="form-group">
        <label for="durationUnit">{{ 'exercise.durationUnit' | translate }}</label>
        <select id="durationUnit" [(ngModel)]="exercise.durationUnit" name="durationUnit">
          <option value="seconds">{{ 'workout.seconds' | translate }}</option>
          <option value="minutes">{{ 'workout.minutes' | translate }}</option>
          <option value="hours">{{ 'workout.hours' | translate }}</option>
        </select>
      </div>
    }

    <div class="form-actions">
      <button type="submit" class="btn">{{ (isEdit ? 'common.update' : 'common.create') | translate }}</button>
      <a routerLink="/exercises" class="btn btn-secondary">{{ 'common.cancel' | translate }}</a>
    </div>
  </form>
</div>
