<div class="settings">
  <h2>{{ 'settings.title' | translate }}</h2>

  <div class="settings-section">
    <h3>{{ 'settings.profile' | translate }}</h3>
    <div class="profile-info">
      <p><strong>{{ 'settings.email' | translate }}:</strong> {{ email }}</p>
    </div>
  </div>

  <div class="settings-section">
    <h3>{{ 'settings.appearance' | translate }}</h3>
    <div class="form-group">
      <label>{{ 'settings.theme' | translate }}</label>
      <div class="theme-toggle">
        <button (click)="setTheme('auto')" class="btn" [class.btn-primary]="theme==='auto'">{{ 'settings.themeAuto' | translate }}</button>
        <button (click)="setTheme('dark')" class="btn" [class.btn-primary]="theme==='dark'">{{ 'settings.themeDark' | translate }}</button>
        <button (click)="setTheme('light')" class="btn" [class.btn-primary]="theme==='light'">{{ 'settings.themeLight' | translate }}</button>
      </div>
    </div>
  </div>

  <div class="settings-section">
    <h3>{{ 'settings.language' | translate }}</h3>
    <div class="form-group">
      <select [ngModel]="language" (ngModelChange)="setLanguage($event)" name="language">
        <option value="kz">{{ 'settings.languageKz' | translate }}</option>
        <option value="ru">{{ 'settings.languageRu' | translate }}</option>
        <option value="en">{{ 'settings.languageEn' | translate }}</option>
      </select>
    </div>
  </div>

  <div class="settings-section">
    <h3>{{ 'settings.account' | translate }}</h3>
    <button (click)="authService.logout()" class="btn btn-danger">{{ 'settings.logout' | translate }}</button>
  </div>

  @if (success) {
    <div class="success">{{ success }}</div>
  }
</div>
