<div class="settings">
  <h2>Account</h2>

  <div class="settings-section">
    <h3>Profile</h3>
    <div class="profile-info">
      <p><strong>Email:</strong> {{ email }}</p>
    </div>
  </div>

  <div class="settings-section">
    <h3>Appearance</h3>
    <div class="form-group">
      <label>Theme</label>
      <div class="theme-toggle">
        <button (click)="setTheme('auto')" class="btn" [class.btn-primary]="theme==='auto'">Auto</button>
        <button (click)="setTheme('dark')" class="btn" [class.btn-primary]="theme==='dark'">Dark</button>
        <button (click)="setTheme('light')" class="btn" [class.btn-primary]="theme==='light'">Light</button>
      </div>
    </div>
  </div>

  <div class="settings-section">
    <h3>Account</h3>
    <button (click)="authService.logout()" class="btn btn-danger">Logout</button>
  </div>

  @if (success) {
    <div class="success">{{ success }}</div>
  }
</div>
