<div class="progress-page">
  <div class="header">
    <h2>{{ 'progress.title' | translate }}</h2>
    <button class="btn btn-primary" (click)="openAddChart()">{{ 'progress.addChart' | translate }}</button>
  </div>

  @if (loading) {
    <p>{{ 'common.loading' | translate }}</p>
  } @else if (charts.length === 0) {
    <div class="empty-state">
      <p class="empty">{{ 'progress.empty' | translate }}</p>
    </div>
  } @else {
    <div class="dashboard-grid">
      @for (chart of charts; track chart.id; let i = $index) {
        <div class="chart-wrapper">
          <app-chart-tile [chart]="chart"></app-chart-tile>
          <div class="chart-controls">
            <button class="btn btn-small" (click)="openEditChart(chart)">{{ 'progress.edit' | translate }}</button>
            <button class="btn btn-small" (click)="moveUp(chart, i)" [disabled]="i === 0">{{ 'progress.moveUp' | translate }}</button>
            <button class="btn btn-small" (click)="moveDown(chart, i)" [disabled]="i === charts.length - 1">{{ 'progress.moveDown' | translate }}</button>
            <button class="btn btn-small btn-danger" (click)="deleteChart(chart)">{{ 'progress.delete' | translate }}</button>
          </div>
        </div>
      }
    </div>
  }
</div>

<app-chart-editor
  [chart]="editingChart"
  [isOpen]="editorOpen"
  (save)="saveChart($event)"
  (cancel)="closeEditor()">
</app-chart-editor>
