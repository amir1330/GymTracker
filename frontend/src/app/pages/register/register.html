<div class="auth-container">
  <div class="auth-box">
    <h2>Register</h2>
    @if (error) {
      <div class="error">{{ error }}</div>
    }
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" [(ngModel)]="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" required>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" required>
      </div>
      <div class="form-group">
        <label for="weight">Weight (kg)</label>
        <input type="number" id="weight" [(ngModel)]="weight" name="weight" step="0.1">
      </div>
      <div class="form-group">
        <label for="height">Height (cm)</label>
        <input type="number" id="height" [(ngModel)]="height" name="height" step="0.1">
      </div>
      <button type="submit" class="btn btn-primary">Register</button>
    </form>
    <p class="switch-link">Already have an account? <a routerLink="/login">Login</a></p>
  </div>
</div>
