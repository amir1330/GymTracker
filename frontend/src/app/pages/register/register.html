<div class="auth-container">
  <div class="auth-box">
    <h2>{{ 'auth.register' | translate }}</h2>
    @if (error) {
      <div class="error">{{ error }}</div>
    }
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">{{ 'auth.email' | translate }}</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="password">{{ 'auth.password' | translate }}</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" required>
      </div>
      <div class="form-group">
        <label for="confirmPassword">{{ 'auth.confirmPassword' | translate }}</label>
        <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" required>
      </div>
      <button type="submit" class="btn btn-primary">{{ 'auth.registerButton' | translate }}</button>
    </form>
    <p class="switch-link">{{ 'auth.hasAccount' | translate }} <a routerLink="/login">{{ 'auth.login' | translate }}</a></p>
  </div>
</div>
