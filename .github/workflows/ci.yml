name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88
      - name: Backend check (Rust Axum)
        working-directory: backend
        run: cargo check
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-svelte/package.json
      - name: Frontend build (SvelteKit)
        working-directory: frontend-svelte
        run: npm ci || npm install; npm run build

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}-rs:latest
            ${{ steps.meta.outputs.image }}-rs:${{ github.sha }}

      - name: Build and push frontend-svelte
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-svelte
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}-frontend:latest
            ${{ steps.meta.outputs.image }}-frontend:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: gymtracker-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Hardened path: non-root user + forced-command key.
      # stdin protocol: GHCR_USER\nGHCR_TOKEN\n + tar(cz) of compose/scripts
      # remote forced command: sync-deploy → ci-entry.sh
      - name: Sync and recreate over restricted SSH
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "${RUNNER_TEMP}/deploy_key"
          printf '%s\n' "$SSH_KEY" > "${RUNNER_TEMP}/deploy_key"
          {
            printf '%s\n' "$GHCR_USER"
            printf '%s\n' "$GHCR_TOKEN"
            tar czf - docker-compose.prod.yml deploy/remote.sh deploy/ci-entry.sh
          } | ssh -i "${RUNNER_TEMP}/deploy_key" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=.github/known_hosts \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "${USERNAME}@${HOST}" sync-deploy
